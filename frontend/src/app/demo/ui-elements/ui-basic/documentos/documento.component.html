<H3>CORRESPONDENCIA Y MATERIALES</H3>
<hr />

<!-- BUSCADORES DE CLIENTES -->
<div class="container mt-4">
  <div class="row g-3">
    <div class="col-md-6">
      <div class="input-group">
        <input
          type="text"
          class="form-control"
          placeholder="Buscar Cliente Rmt..."
          name="buscarClienteRmt"
          [(ngModel)]="textoBusqueda"
          (keyup.enter)="buscarCliente()"
        />
        <button class="btn btn-primary" type="button" (click)="buscarCliente()">Buscar</button>
      </div>
    </div>
    <div class="col-md-6">
      <div class="input-group">
        <input
          type="text"
          class="form-control"
          placeholder="Buscar Cliente Dto..."
          name="buscarClienteDto"
          [(ngModel)]="textoBusquedaDto"
          (keyup.enter)="buscarClienteDto()"
        />
        <button class="btn btn-primary" type="button" (click)="buscarClienteDto()">Buscar</button>
      </div>
    </div>
  </div>
</div>

<!-- INFORMACION DE LOS CLIENTES -->
<div class="container">
  <div class="row g-4 mt-2">
    <!-- CLIENTE REMITE -->
    <div class="col-md-6">
      <div class="card shadow-sm p-4">
        <div class="d-flex justify-content-between align-items-center">
          <h5>Cliente Remite</h5>
          <button
            class="btn btn-outline-secondary btn-sm"
            type="button"
            [disabled]="!clienteRmtSeleccionado?.idClienteRmt"
            (click)="editarCliente(modalEditarCliente)"
          >
            <i class="feather icon-edit-2"></i>
            Editar
          </button>
        </div>
        <hr />

        <form>
          <div class="mb-3">
            <label>Nombre</label>
            <input
              type="text"
              class="form-control"
              name="nombreClienteRmt"
              placeholder="Nombre del Cliente"
              [(ngModel)]="clienteRmtSeleccionado.nombreClienteRmt"
              readonly
            />
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label>Tipo Documento</label>
              <input
                placeholder="Tipo Documento"
                class="form-control"
                name="tipoDocumentoClienteRmt"
                [(ngModel)]="clienteRmtSeleccionado.tipoDocumentoRmt"
                readonly
              />
            </div>

            <div class="col-md-6 mb-3">
              <label>Documento</label>
              <input
                placeholder="Documento"
                class="form-control"
                name="documentoClienteRmt"
                [(ngModel)]="clienteRmtSeleccionado.documentoClienteRmt"
                readonly
              />
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label>Dirección</label>
              <input
                type="text"
                placeholder="Dirección"
                class="form-control"
                name="direccionClienteRmt"
                [(ngModel)]="clienteRmtSeleccionado.direccionClienteRmt"
                readonly
              />
            </div>

            <div class="col-md-6 mb-3">
              <label>Teléfono</label>
              <input
                type="text"
                class="form-control"
                placeholder="Teléfono"
                name="telefonoClienteRmt"
                [(ngModel)]="clienteRmtSeleccionado.telefonoClienteRmt"
                readonly
              />
            </div>
          </div>
        </form>
      </div>
    </div>

    <!-- CLIENTE DESTINO -->
    <div class="col-md-6">
      <div class="card shadow-sm p-4">
        <div class="d-flex justify-content-between align-items-center">
          <h5>Cliente Destino</h5>
          <button
            class="btn btn-outline-secondary btn-sm"
            type="button"
            [disabled]="!clienteDtoSeleccionado?.idClienteDto"
            (click)="editarClienteDto(modalEditarClienteDto)"
          >
            <i class="feather icon-edit-2"></i>
            Editar
          </button>
        </div>
        <hr />

        <form>
          <div class="mb-3">
            <label>Nombre</label>
            <input
              type="text"
              class="form-control"
              name="nombreClienteDto"
              placeholder="Nombre del Cliente Dto"
              [(ngModel)]="clienteDtoSeleccionado.nombreClienteDto"
              readonly
            />
          </div>

          <div class="row">
            <div class="col-md-4 mb-3">
              <label>Tipo Documento</label>
              <input
                type="text"
                class="form-control"
                placeholder="Tipo Documento"
                name="tipoDocumentoClienteDto"
                [(ngModel)]="clienteDtoSeleccionado.tipoDocumentoDto"
                readonly
              />
            </div>
            <div class="col-md-4 mb-3">
              <label>Documento</label>
              <input
                type="text"
                class="form-control"
                placeholder="Documento"
                name="documentoClienteDto"
                [(ngModel)]="clienteDtoSeleccionado.documentoClienteDto"
                readonly
              />
            </div>

            <div class="col-md-4 mb-3">
              <label>TD</label>
              <input
                type="text"
                class="form-control"
                placeholder="TD"
                name="td"
                [(ngModel)]="clienteDtoSeleccionado.td"
                readonly
              />
            </div>
          </div>

          <div class="row">
            <div class="col-md-4 mb-3">
              <label>NIU</label>
              <input
                type="text"
                class="form-control"
                placeholder="NIU"
                name="niu"
                [(ngModel)]="clienteDtoSeleccionado.niu"
                readonly
              />
            </div>

            <div class="col-md-4 mb-3">
              <label>Pabellón</label>
              <input
                type="text"
                class="form-control"
                placeholder="Pabellón"
                name="pabellon"
                [(ngModel)]="clienteDtoSeleccionado.pabellon"
                readonly
              />
            </div>

            <div class="col-md-4 mb-3">
              <label>Estructura</label>
              <input
                type="text"
                class="form-control"
                placeholder="Estructura"
                name="estructura"
                [(ngModel)]="clienteDtoSeleccionado.estructura"
                readonly
              />
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- DATOS DE LA CORRESPONDENCIA -->
<div class="container">
  <div class="row g-4 mt-2">
    <div class="col-md-12">
      <div class="card shadow-sm p-4">
        <h5>Correspondencia y Materiales</h5>
        <hr />

        <form>
          <div class="mb-3 d-flex gap-4">
            <div class="form-check">
              <input
                type="checkbox"
                class="form-check-input"
                id="tipoCorrespondencia"
                name="tipoCorrespondencia"
                [checked]="!esMaterial"
                (change)="seleccionarTipoRegistro(false)"
              />
              <label class="form-check-label" for="tipoCorrespondencia">Correspondencia</label>
            </div>
            <div class="form-check">
              <input
                type="checkbox"
                class="form-check-input"
                id="tipoMateriales"
                name="tipoMateriales"
                [checked]="esMaterial"
                (change)="seleccionarTipoRegistro(true)"
              />
              <label class="form-check-label" for="tipoMateriales">Materiales</label>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label>Tipo de Documento</label>
              <input
                type="text"
                class="form-control"
                placeholder="Ej: Guía, Carta, Recibo..."
                name="tipoDocumento"
                [(ngModel)]="tipoDocumento"
              />
            </div>

            <div class="col-md-6 mb-3">
              <label>Estado de Envío</label>
              <select class="form-select" name="estadoEnvio" [(ngModel)]="estadoEnvio">
                <option value="PENDIENTE">Pendiente</option>
                <option value="ENVIADO">Enviado</option>
                <option value="ENTREGADO">Entregado</option>
                <option value="CANCELADO">Cancelado</option>
              </select>
            </div>
          </div>

          <div class="mb-3">
            <label>Observación</label>
            <textarea
              class="form-control"
              rows="3"
              name="observacion"
              placeholder="Observación"
              [(ngModel)]="observacion"
            ></textarea>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- BOTON GUARDAR -->
<div class="text-center mt-4">
  <button class="btn btn-primary px-5" (click)="guardar(modalContent)">GUARDAR</button>
</div>

<!-- MODAL -->
<ng-template #modalContent let-modal>
  <div class="modal-header">
    <h4 class="modal-title">CORRESPONDENCIA Y MATERIALES GUARDADA</h4>
    <button type="button" class="btn-close" (click)="modal.dismiss()"></button>
  </div>

  <div class="modal-body">
    <h5>Cliente Remite</h5>

    <div class="row mb-3">
      <div class="col-md-6">
        <label>Nombre</label>
        <input type="text" class="form-control" [(ngModel)]="documentoGuardado.nombre_cliente_rmt" readonly />
      </div>
      <div class="col-md-3">
        <label>Tipo Doc</label>
        <input type="text" class="form-control" [(ngModel)]="documentoGuardado.tipo_documento_rmt" readonly />
      </div>
      <div class="col-md-3">
        <label>Documento</label>
        <input type="text" class="form-control" [(ngModel)]="documentoGuardado.documento_cliente_rmt" readonly />
      </div>
    </div>

    <h5>Cliente Destino</h5>

    <div class="row mb-3">
      <div class="col-md-6">
        <label>Nombre</label>
        <input type="text" class="form-control" [(ngModel)]="documentoGuardado.nombre_cliente_dto" readonly />
      </div>
      <div class="col-md-3">
        <label>Tipo Doc</label>
        <input type="text" class="form-control" [(ngModel)]="documentoGuardado.tipo_documento_dto" readonly />
      </div>
      <div class="col-md-3">
        <label>Documento</label>
        <input type="text" class="form-control" [(ngModel)]="documentoGuardado.documento_cliente_dto" readonly />
      </div>
    </div>

    <h5>Correspondencia y Materiales</h5>

    <div class="row mb-3">
      <div class="col-md-4">
        <label>N° Radicado</label>
        <input type="text" class="form-control fw-bold" [(ngModel)]="documentoGuardado.numero_radicado" readonly />
      </div>
      <div class="col-md-4">
        <label>Tipo de Documento</label>
        <input type="text" class="form-control" [(ngModel)]="documentoGuardado.tipo_documento" readonly />
      </div>
      <div class="col-md-4">
        <label>Estado de Envío</label>
        <input type="text" class="form-control" [(ngModel)]="documentoGuardado.estado_envio" readonly />
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-md-6">
        <label>Fecha de Recibido</label>
        <input type="text" class="form-control" [(ngModel)]="documentoGuardado.fecha_recibido" readonly />
      </div>
      <div class="col-md-6">
        <label>Fecha de Entrega</label>
        <input type="text" class="form-control" [(ngModel)]="documentoGuardado.fecha_entrega" readonly />
      </div>
    </div>
    <div class="text-center mt-4">
      <button class="btn btn-success" (click)="imprimirGuardado()">
        <i class="feather icon-download"></i>
        IMPRIMIR / DESCARGAR
      </button>
    </div>
  </div>

  <div class="modal-footer">
    <button class="btn btn-secondary" (click)="modal.close(); limpiarFormulario()">Cerrar</button>
  </div>
</ng-template>

<!-- MODAL EDITAR CLIENTE -->
<ng-template #modalEditarCliente let-modal>
  <div class="modal-header">
    <h4 class="modal-title">EDITAR CLIENTE</h4>
    <button type="button" class="btn-close" (click)="modal.dismiss()"></button>
  </div>

  <div class="modal-body">
    <div class="mb-3">
      <label>Nombre</label>
      <input type="text" class="form-control" name="editNombre" [(ngModel)]="clienteEnEdicion.nombreClienteRmt" />
    </div>

    <div class="row">
      <div class="col-md-6 mb-3">
        <label>Tipo Documento</label>
        <input type="text" class="form-control" name="editTipoDocumento" [(ngModel)]="clienteEnEdicion.tipoDocumentoRmt" />
      </div>

      <div class="col-md-6 mb-3">
        <label>Documento</label>
        <input type="text" class="form-control" name="editDocumento" [(ngModel)]="clienteEnEdicion.documentoClienteRmt" />
      </div>
    </div>

    <div class="row">
      <div class="col-md-6 mb-3">
        <label>Dirección</label>
        <input type="text" class="form-control" name="editDireccion" [(ngModel)]="clienteEnEdicion.direccionClienteRmt" />
      </div>

      <div class="col-md-6 mb-3">
        <label>Teléfono</label>
        <input type="text" class="form-control" name="editTelefono" [(ngModel)]="clienteEnEdicion.telefonoClienteRmt" />
      </div>
    </div>
  </div>

  <div class="modal-footer">
    <button class="btn btn-secondary" (click)="modal.dismiss()">Cancelar</button>
    <button class="btn btn-primary" (click)="guardarClienteEditado(modal)">Guardar Cambios</button>
  </div>
</ng-template>

<!-- MODAL EDITAR CLIENTE DESTINO -->
<ng-template #modalEditarClienteDto let-modal>
  <div class="modal-header">
    <h4 class="modal-title">EDITAR CLIENTE DESTINO</h4>
    <button type="button" class="btn-close" (click)="modal.dismiss()"></button>
  </div>

  <div class="modal-body">
    <div class="mb-3">
      <label>Nombre</label>
      <input type="text" class="form-control" name="editDtoNombre" [(ngModel)]="clienteDtoEnEdicion.nombreClienteDto" />
    </div>

    <div class="row">
      <div class="col-md-4 mb-3">
        <label>Tipo Documento</label>
        <input type="text" class="form-control" name="editDtoTipoDocumento" [(ngModel)]="clienteDtoEnEdicion.tipoDocumentoDto" />
      </div>
      <div class="col-md-4 mb-3">
        <label>Documento</label>
        <input type="text" class="form-control" name="editDtoDocumento" [(ngModel)]="clienteDtoEnEdicion.documentoClienteDto" />
      </div>
      <div class="col-md-4 mb-3">
        <label>TD</label>
        <input type="text" class="form-control" name="editDtoTd" [(ngModel)]="clienteDtoEnEdicion.td" />
      </div>
    </div>

    <div class="row">
      <div class="col-md-4 mb-3">
        <label>NIU</label>
        <input type="text" class="form-control" name="editDtoNiu" [(ngModel)]="clienteDtoEnEdicion.niu" />
      </div>
      <div class="col-md-4 mb-3">
        <label>Pabellón</label>
        <input type="text" class="form-control" name="editDtoPabellon" [(ngModel)]="clienteDtoEnEdicion.pabellon" />
      </div>
      <div class="col-md-4 mb-3">
        <label>Estructura</label>
        <input type="text" class="form-control" name="editDtoEstructura" [(ngModel)]="clienteDtoEnEdicion.estructura" />
      </div>
    </div>
  </div>

  <div class="modal-footer">
    <button class="btn btn-secondary" (click)="modal.dismiss()">Cancelar</button>
    <button class="btn btn-primary" (click)="guardarClienteDtoEditado(modal)">Guardar Cambios</button>
  </div>
</ng-template>
